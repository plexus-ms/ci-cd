name: _release-package

# The package shape of the release verb (§ 5 PLX-Delivery): from verified
# code on the trunk, version and publish with changesets. On a push with
# pending changesets it opens or updates the "version packages" PR; on the
# push that merges that PR it publishes, token-less through OIDC trusted
# publishing, with provenance. The caller runs this after _verify.yml in the
# same run; the verb does not re-verify.

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for every job: GitHub's `ubuntu-latest`, or the label of a
          runner the tenant owns (GitHub bills minutes only on its own runners).
        required: false
        type: string
        default: ubuntu-latest
      persistent:
        description: >-
          The runner keeps its disk between jobs (a runner the tenant owns):
          caches then stay on the machine instead of round-tripping through
          GitHub (§ 4 PLX-Delivery).
        required: false
        type: boolean
        default: false

permissions:
  contents: write       # push the version PR and the tags
  pull-requests: write  # open the "version packages" PR
  id-token: write       # npm build provenance

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    concurrency: release
    # mise install runs the postinstall hook, which points core.hooksPath at
    # hk, so hk's hooks would fire on the commits and pushes changesets/action
    # makes. Wrong in both directions: pre-push cannot resolve the tag objects
    # `changeset publish` pushes, and re-running verify here only repeats
    # what the verify job already ran.
    env:
      HK_SKIP_HOOK: pre-commit,pre-push
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: ${{ !inputs.persistent }}
      - run: pnpm install --frozen-lockfile
      # Build every package in dependency order before publishing: `changeset
      # publish` runs the packages' `prepack` hooks alphabetically, so a
      # package bundling a workspace sibling would otherwise find no dist.
      - run: pnpm exec turbo run build
      - uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
          commit: "chore: version packages"
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
