name: deploy

# Reusable deploy for Plexus apps. Thin wrapper that mounts the stateless deploy
# verb (scripts/deploy.sh in this repo) on the push event; the tenant supplies
# the host + SSH key. The caller is the app's SOURCE repo (§ 5.2 PLX) — an app
# repo after ci, or the platform repo for a third-party app — because the verb
# reads apps/<app>/docker/compose.yaml from the checkout and renders it onto
# the host with the image ref pinned. Apps reference it after ci:
#
#   deploy:
#     needs: ci
#     if: github.ref == 'refs/heads/main'
#     uses: plexus-ms/ci-cd/.github/workflows/deploy.yml@0.39.0
#     with:
#       tenant: plexus
#       app: website
#       image-ref: ${{ needs.ci.outputs.image-ref }}
#       host: deploy@<your-host>
#     secrets:
#       ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
#
# A third-party app pins its image in compose.yaml and omits image-ref.

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for all jobs (e.g. `self-hosted` for a tenant-owned
          runner — GitHub bills minutes only on GitHub-hosted runners).
        required: false
        type: string
        default: ubuntu-latest
      tenant:
        description: Tenant id — first segment of the app dir (/opt/stacks/<tenant>/<app>).
        required: true
        type: string
      app:
        required: true
        type: string
      image-ref:
        description: >-
          Full image ref to deploy (name:tag), e.g. ci's output. Empty for a
          third-party app whose compose.yaml pins its own image.
        required: false
        type: string
        default: ''
      host:
        description: SSH target, e.g. deploy@1.2.3.4.
        required: true
        type: string
      health-url:
        description: >-
          Healthcheck URL polled on the host. Defaults to the app's readiness
          path (/healthz, or its plexus.healthz label) on its loopback port
          (PLEXUS_LOOPBACK_PORT in the app dir's .env).
        required: false
        type: string
        default: ''
    secrets:
      ssh-key:
        description: Private key authorized as the deploy user on the host.
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ inputs.runner }}
    # Serialize deploys per app+host: at most one running and one pending run
    # per group, and GitHub replaces the pending run with the newest — so the
    # newest commit always deploys last. Never cancels a mid-flight deploy
    # (cancelling between migrate and up would strand the host).
    concurrency:
      group: deploy-${{ inputs.tenant }}-${{ inputs.app }}-${{ inputs.host }}
      cancel-in-progress: false
    steps:
      # The caller's repo (the app's source repo) — cwd for the verb, which
      # reads apps/<app>/ relative here. Same SHA the image was built from.
      - uses: actions/checkout@v7
      # The verb itself lives in ci-cd; pin it to the exact workflow version.
      - uses: actions/checkout@v7
        with:
          repository: plexus-ms/ci-cd
          ref: ${{ github.job_workflow_sha }}
          path: .plexus-ci-src
      - name: Load SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "${{ secrets.ssh-key }}" | ssh-add -
      - name: Deploy
        env:
          PLEXUS_HEALTH_URL: ${{ inputs.health-url }}
        run: bash .plexus-ci-src/scripts/deploy.sh '${{ inputs.host }}' '${{ inputs.tenant }}' '${{ inputs.app }}' '${{ inputs.image-ref }}'
