name: plexus-changes

# Reusable change-detection (§ 2 PLX-Release). Mounts the changed-apps verb on
# push/PR and emits the changed app set as a JSON array for a downstream matrix.
# Logic lives in scripts/changed-apps.sh, never here — this wrapper only plumbs
# event refs in and JSON out.

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for all jobs (e.g. `self-hosted` for a tenant-owned
          runner — GitHub bills minutes only on GitHub-hosted runners).
        required: false
        type: string
        default: ubuntu-latest
      ci-ref:
        description: >-
          ci-cd ref (tag or SHA) to load the verb from. Only needed when this
          workflow is called nested (caller → own reusable workflow → here):
          there github.job_workflow_sha is empty and the run fails instead of
          silently loading the verb from main. Pass the tag you pinned in
          `uses:`.
        required: false
        type: string
        default: ''
    outputs:
      apps:
        description: JSON array of changed app dir names (e.g. ["website"], or []).
        value: ${{ jobs.detect.outputs.apps }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ${{ inputs.runner }}
    outputs:
      apps: ${{ steps.run.outputs.apps }}
    steps:
      # The caller's repo (the tenant) — cwd for the verb, which reads apps/* +
      # git relative here. Full history so github.event.before is reachable.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The verb itself lives in ci-cd; pin it to the exact workflow version.
      # github.job_workflow_sha is empty in nested reusable-workflow calls —
      # checkout would then fall back to main, so require ci-ref instead.
      - id: ci-ref
        env:
          CI_REF: ${{ inputs.ci-ref }}
          JOB_WORKFLOW_SHA: ${{ github.job_workflow_sha }}
        run: |
          ref="${CI_REF:-$JOB_WORKFLOW_SHA}"
          if [ -z "$ref" ]; then
            echo "::error::github.job_workflow_sha is empty (nested reusable-workflow call) — pass the pinned ci-cd tag as input ci-ref"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: plexus-ms/ci-cd
          ref: ${{ steps.ci-ref.outputs.ref }}
          path: .plexus-ci-src
      - uses: jdx/mise-action@v4
      - id: refs
        # PRs diff against the merge base; pushes against the previous tip.
        run: |
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            echo "from=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "from=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - id: run
        # Verb prints one app per line; jq folds it to a compact JSON array
        # ([] when empty) for fromJSON in the caller's matrix.
        run: |
          apps=$(bash .plexus-ci-src/scripts/changed-apps.sh '${{ steps.refs.outputs.from }}' '${{ github.sha }}' | jq -R . | jq -sc .)
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
