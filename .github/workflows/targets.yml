name: plexus-targets

# Reusable deploy-target lookup (§ 3 PLX-Platform). Mounts the deploy-targets
# verb on a platform repo and emits {app: target} for the caller to index per
# matrix leg. Logic lives in scripts/deploy-targets.sh, never here.

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for all jobs (e.g. `self-hosted` for a tenant-owned
          runner — GitHub bills minutes only on GitHub-hosted runners).
        required: false
        type: string
        default: ubuntu-latest
      ci-ref:
        description: >-
          ci-cd ref (tag or SHA) to load the verb from. Only needed when this
          workflow is called nested (caller → own reusable workflow → here):
          there github.job_workflow_sha is empty and the run fails instead of
          silently loading the verb from main. Pass the tag you pinned in
          `uses:`.
        required: false
        type: string
        default: ''
    outputs:
      map:
        description: JSON object of app name → deploy target, for the apps whose inventory file names one.
        value: ${{ jobs.lookup.outputs.map }}

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ${{ inputs.runner }}
    outputs:
      map: ${{ steps.run.outputs.map }}
    steps:
      - uses: actions/checkout@v7
      # The verb itself lives in ci-cd; pin it to the exact workflow version.
      # github.job_workflow_sha is empty in nested reusable-workflow calls —
      # checkout would then fall back to main, so require ci-ref instead.
      - id: ci-ref
        env:
          CI_REF: ${{ inputs.ci-ref }}
          JOB_WORKFLOW_SHA: ${{ github.job_workflow_sha }}
        run: |
          ref="${CI_REF:-$JOB_WORKFLOW_SHA}"
          if [ -z "$ref" ]; then
            echo "::error::github.job_workflow_sha is empty (nested reusable-workflow call) — pass the pinned ci-cd tag as input ci-ref"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: plexus-ms/ci-cd
          ref: ${{ steps.ci-ref.outputs.ref }}
          path: .plexus-ci-src
      - id: run
        run: echo "map=$(bash .plexus-ci-src/scripts/deploy-targets.sh inventory)" >> "$GITHUB_OUTPUT"
