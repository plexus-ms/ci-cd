name: plexus-targets

# Reusable deploy-target lookup (§ 3 PLX-Platform). Mounts the deploy-targets
# verb on a platform repo and emits {app: target} for the caller to index per
# matrix leg. Logic lives in scripts/deploy-targets.sh, never here.

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for all jobs (e.g. `self-hosted` for a tenant-owned
          runner — GitHub bills minutes only on GitHub-hosted runners).
        required: false
        type: string
        default: ubuntu-latest
    outputs:
      map:
        description: JSON object of app name → deploy target, for the apps whose inventory file names one.
        value: ${{ jobs.lookup.outputs.map }}

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ${{ inputs.runner }}
    outputs:
      map: ${{ steps.run.outputs.map }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: plexus-ms/ci-cd
          ref: ${{ github.job_workflow_sha }}
          path: .plexus-ci-src
      - id: run
        run: echo "map=$(bash .plexus-ci-src/scripts/deploy-targets.sh inventory)" >> "$GITHUB_OUTPUT"
