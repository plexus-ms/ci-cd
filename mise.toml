# ci-cd is a plexus-ms repo and eats the initiative's own cooking (§ 1.8 PLX): tools pinned here, verbs as mise tasks, checks wired through hk.
# The reusable workflows are thin mounts of the plx verbs (@plexus-ms/cli,
# pinned by the calling repo); no logic lives here, so the one check is
# actionlint over the workflows (PLX-Delivery, "Maintaining").

# Verbs are asked as `mise :verb` like in every Plexus repo (§ 2 PLX-Repo); that
# form needs the root marker even without sub-projects.
monorepo_root = true
# mise no longer walks the tree for project configs; the root is the only one.
[monorepo]
config_roots = ["."]

[tools]
hk = "latest"                # Git hooks
actionlint = "1.7.12"        # the workflows' static check: expressions, inputs and outputs, shellcheck over run blocks
shellcheck = "0.11.0"        # what actionlint runs over the workflows' run blocks

[hooks]
postinstall = "hk install --mise"

# Contract verbs (§ 3 PLX-Repo) — the ones this repo has no use for exist and
# pass as documented no-ops.

[tasks.dev]
description = "No-op: nothing to start; the verbs are hand-runnable scripts"
run = 'echo "dev: nothing to start in ci-cd"'

[tasks.build]
description = "No-op: workflows ship as source, referenced by tag"
run = 'echo "build: nothing to build in ci-cd"'

[tasks.verify]
description = "Perform all steps that verify code quality: check, then test"
run = ['mise run check', 'mise run test']

[tasks.check]
description = "Static checks: actionlint over the workflows, shellcheck over their run blocks"
run = 'actionlint'

[tasks.test]
description = "No-op: the verbs are tested in plexus-ms/packages, the mounts by the dogfood tenant's pipelines"
run = 'echo "test: nothing to test in ci-cd"'
